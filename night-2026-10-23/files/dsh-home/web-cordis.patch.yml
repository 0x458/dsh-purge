# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: venice
    model: deepseek-v4-1-flash-uncensored
    reasoningEffort: high
- id: subagent-model-selection-settings
  name: "@deepseek-ai/dsh-tool-subagent/model-selection-settings"
  config:
    enabled: true
    allowedModels:
      - provider: venice
        model: deepseek-v4-1-flash-uncensored
- id: web
  name: "@deepseek-ai/dsh-web"
  config:
    searchProvider: deepseek-search-api
    fetchProvider: deepseek-fetch-api
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: standard
    performanceUsage: compact
- id: ui-conversation
  name: "@deepseek-ai/dsh-client-ui-conversation"
  config:
    busyEnter: steer
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: cordis
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: light
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
- id: dshm
  name: dsh-m
  config:
    communityCatalog: false

- insert:
    - id: dsh-purge
      name: dsh-purge
      inject: [systemPrompt, tools]
      config:
        enabled: true
        autoApplyOnStart: false
        autoUpdateOnStart: false
        autoRevertOnMissing: false
        injectOnce: false
        stripMnemon: true
        verbose: false
        postPrompt: ""
        postPromptOrder: 5100
        autoRetry: true
        retryMax: 3
        autoContinue: false
        continueMax: 3
        continueText: "继续"
        capabilityProtocol: true
        hooksDenyBypass: true

- id: llm-pi-ai
  config:
    providers:
      venice:
        displayName: Venice
        baseURL: https://api.venice.ai/api/v1
        apiKeyEnv: VENICE_API_KEY
        api: openai-completions
        models:
          - id: deepseek-v4-1-flash-uncensored
            name: DeepSeek V4.1 Flash Uncensored
            contextWindow: 1000000
            maxTokens: 8192
            input: [text]
            reasoningEfforts: false
          - id: deepseek-v4-1-flash
            name: DeepSeek V4.1 Flash (censored)
            contextWindow: 1000000
            maxTokens: 8192
            input: [text]
            reasoningEfforts: false
          - id: venice-uncensored-1-2
            name: Venice Uncensored 1.2
            contextWindow: 128000
            maxTokens: 8192
            input: [text]
            reasoningEfforts: false
